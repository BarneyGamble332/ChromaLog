name: Pakete
# Baut die Android-App (APK) und die Linux-Version (AppImage, deb) und legt sie unter „Releases“ als „Aktueller Stand“ ab.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pakete
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        working-directory: mobile
        run: npm ci
      - name: Android-Projekt erzeugen
        working-directory: mobile
        run: |
          ../tools/copy_web.sh www
          npx cap add android
          python3 ../tools/android_patch.py android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK benennen
        run: |
          V=$(node -p "require('./mobile/package.json').version")
          mkdir -p out && cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "out/ChromaLog-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: desktop
        run: npm ci
      - name: AppImage und deb bauen
        working-directory: desktop
        run: npm run dist
      - name: Selbsttest der AppImage (startet, Simulator läuft, Anschlüsse vorhanden)
        working-directory: desktop
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          CHROMALOG_SMOKE=1 timeout 120 xvfb-run -a ./dist/ChromaLog-*.AppImage --appimage-extract-and-run --no-sandbox 2>&1 | tee smoke.log | grep SMOKE
          grep -q '"serial":true' smoke.log && grep -q '"data":true' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
  release:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: „Aktueller Stand“ unter Releases ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./mobile/package.json').version")
          gh release delete aktuell --cleanup-tag --yes || true
          gh release create aktuell out/* --prerelease --target "$GITHUB_SHA" --title "Aktueller Stand (Version $V)" \
            --notes "Automatisch gebaut aus $GITHUB_SHA. Android: die APK aufs Handy laden und installieren. Linux: die AppImage ausführbar machen und starten, oder das deb-Paket installieren. Anleitung: docs/INSTALLATION.md"
